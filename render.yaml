services:
  - type: web
    name: ai-personal-finance-tracker-api
    runtime: python
    rootDir: Frontend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT Backend:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
