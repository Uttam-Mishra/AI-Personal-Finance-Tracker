<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Finance Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.10.3/dist/Recharts.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
            font-weight: bold;
            color: #1f2937;
        }
        
        .subtitle {
            color: #6b7280;
            margin-top: 8px;
        }
        
        .upload-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-btn:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .upload-btn:disabled {
            background: #d1d5db;
            color: #9ca3af;
            cursor: not-allowed;
        }
        
        .tabs {
            display: flex;
            gap: 16px;
            border-bottom: 2px solid #e5e7eb;
            padding: 16px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 8px 24px;
            border: none;
            background: transparent;
            color: #6b7280;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: capitalize;
        }
        
        .tab:hover {
            background: #f3f4f6;
        }
        
        .tab.active {
            background: #2563eb;
            color: white;
        }
        
        .grid {
            display: grid;
            gap: 24px;
            margin-bottom: 24px;
        }
        
        .grid-3 {
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
        
        .grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
        }
        
        .stat-card {
            border-radius: 16px;
            padding: 24px;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .stat-card.blue {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        
        .stat-card.green {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .stat-card.red {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }
        
        th {
            padding: 12px 16px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }
        
        th:last-child {
            text-align: right;
        }
        
        tbody tr {
            border-bottom: 1px solid #e5e7eb;
            transition: background 0.2s;
        }
        
        tbody tr:hover {
            background: #f9fafb;
        }
        
        td {
            padding: 12px 16px;
            font-size: 14px;
        }
        
        td:last-child {
            text-align: right;
        }
        
        .badge {
            display: inline-flex;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #dbeafe;
            color: #1e40af;
        }
        
        .amount-credit {
            color: #059669;
            font-weight: 600;
        }
        
        .amount-debit {
            color: #dc2626;
            font-weight: 600;
        }
        
        .empty-state {
            text-align: center;
            padding: 48px;
        }
        
        .empty-state svg {
            margin: 0 auto 12px;
        }
        
        .insight-card {
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid;
        }
        
        .insight-card.blue {
            background: #dbeafe;
            border-color: #2563eb;
        }
        
        .insight-card.green {
            background: #d1fae5;
            border-color: #10b981;
        }
        
        .insight-card.yellow {
            background: #fef3c7;
            border-color: #f59e0b;
        }
        
        .insight-card.purple {
            background: #e9d5ff;
            border-color: #8b5cf6;
        }
        
        .insight-title {
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .insight-card.blue .insight-title {
            color: #1e3a8a;
        }
        
        .insight-card.green .insight-title {
            color: #065f46;
        }
        
        .insight-card.yellow .insight-title {
            color: #78350f;
        }
        
        .insight-card.purple .insight-title {
            color: #581c87;
        }
        
        .insight-value {
            color: #374151;
        }
        
        .progress-bar {
            margin-bottom: 12px;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 14px;
        }
        
        .progress-track {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        
        .footer {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-top: 24px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            LineChart, Line, BarChart, Bar, PieChart, Pie, Cell,
            XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer 
        } = Recharts;

        // Icon Components
        const Upload = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
            </svg>
        );

        const TrendingUp = () => (
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                <polyline points="17 6 23 6 23 12"/>
            </svg>
        );

        const TrendingDown = () => (
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/>
                <polyline points="17 18 23 18 23 12"/>
            </svg>
        );

        const Wallet = ({ size = 32 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
                <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
                <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
            </svg>
        );

        const Calendar = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
        );

        const PieChartIcon = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>
                <path d="M22 12A10 10 0 0 0 12 2v10z"/>
            </svg>
        );

        const Tag = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                <line x1="7" y1="7" x2="7.01" y2="7"/>
            </svg>
        );

        const FileText = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
        );

        const AlertCircle = () => (
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        );

        const FinanceTracker = () => {
            const [transactions, setTransactions] = useState([]);
            const [balance, setBalance] = useState(0);
            const [totalIncome, setTotalIncome] = useState(0);
            const [totalExpenses, setTotalExpenses] = useState(0);
            const [isProcessing, setIsProcessing] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');

            const categoryRules = {
                'Food & Dining': ['swiggy', 'zomato', 'restaurant', 'cafe', 'food', 'dominos', 'pizza'],
                'Transportation': ['uber', 'ola', 'metro', 'petrol', 'fuel', 'parking', 'taxi', 'bus'],
                'Shopping': ['amazon', 'flipkart', 'myntra', 'shopping', 'mall', 'store'],
                'Entertainment': ['netflix', 'spotify', 'prime', 'movie', 'cinema', 'gaming'],
                'Bills & Utilities': ['electricity', 'water', 'gas', 'internet', 'broadband', 'mobile', 'recharge', 'bill'],
                'Healthcare': ['pharmacy', 'hospital', 'doctor', 'medicine', 'health', 'apollo'],
                'Education': ['course', 'udemy', 'coursera', 'book', 'education', 'tuition'],
                'Salary': ['salary', 'payroll', 'income', 'credited'],
                'Investment': ['mutual fund', 'stock', 'sip', 'investment', 'zerodha', 'groww'],
                'Other': []
            };

            const categorizeMockML = (description) => {
                const desc = description.toLowerCase();
                for (const [category, keywords] of Object.entries(categoryRules)) {
                    if (keywords.some(keyword => desc.includes(keyword))) {
                        return category;
                    }
                }
                return 'Other';
            };

            const parseUPIStatement = () => {
                const mockTransactions = [
                    { date: '2024-02-01', description: 'Swiggy Food Order', amount: -450, type: 'debit' },
                    { date: '2024-02-01', description: 'Salary Credited', amount: 50000, type: 'credit' },
                    { date: '2024-02-02', description: 'Uber Ride', amount: -180, type: 'debit' },
                    { date: '2024-02-02', description: 'Amazon Shopping', amount: -2500, type: 'debit' },
                    { date: '2024-02-03', description: 'Netflix Subscription', amount: -199, type: 'debit' },
                    { date: '2024-02-03', description: 'Electricity Bill', amount: -1200, type: 'debit' },
                    { date: '2024-02-04', description: 'Zomato Order', amount: -380, type: 'debit' },
                    { date: '2024-02-05', description: 'Petrol Pump', amount: -2000, type: 'debit' },
                    { date: '2024-02-05', description: 'Apollo Pharmacy', amount: -560, type: 'debit' },
                    { date: '2024-02-06', description: 'Mobile Recharge', amount: -299, type: 'debit' },
                    { date: '2024-02-07', description: 'Myntra Shopping', amount: -1800, type: 'debit' },
                    { date: '2024-02-08', description: 'Ola Cab', amount: -250, type: 'debit' },
                    { date: '2024-02-09', description: 'Dominos Pizza', amount: -499, type: 'debit' },
                    { date: '2024-02-10', description: 'Udemy Course', amount: -799, type: 'debit' },
                    { date: '2024-02-11', description: 'Flipkart Order', amount: -3200, type: 'debit' },
                    { date: '2024-02-12', description: 'Internet Bill', amount: -699, type: 'debit' },
                    { date: '2024-02-13', description: 'Movie Tickets', amount: -600, type: 'debit' },
                    { date: '2024-02-14', description: 'Restaurant Dining', amount: -1500, type: 'debit' },
                    { date: '2024-02-15', description: 'Freelance Payment', amount: 15000, type: 'credit' },
                    { date: '2024-02-16', description: 'Groww SIP Investment', amount: -5000, type: 'debit' },
                    { date: '2024-01-28', description: 'Coffee Shop', amount: -250, type: 'debit' },
                    { date: '2024-01-29', description: 'Bus Pass', amount: -500, type: 'debit' },
                    { date: '2024-01-30', description: 'Grocery Store', amount: -2200, type: 'debit' },
                    { date: '2024-01-31', description: 'Gas Bill', amount: -800, type: 'debit' },
                ];

                return mockTransactions.map((txn, index) => ({
                    id: Date.now() + index,
                    ...txn,
                    category: categorizeMockML(txn.description),
                    confidence: (Math.random() * 0.3 + 0.7).toFixed(2)
                }));
            };

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (file) {
                    setIsProcessing(true);
                    setTimeout(() => {
                        const parsedTransactions = parseUPIStatement();
                        setTransactions(parsedTransactions);
                        setIsProcessing(false);
                    }, 2000);
                }
            };

            useEffect(() => {
                const income = transactions.filter(t => t.type === 'credit').reduce((sum, t) => sum + t.amount, 0);
                const expenses = transactions.filter(t => t.type === 'debit').reduce((sum, t) => sum + Math.abs(t.amount), 0);
                setTotalIncome(income);
                setTotalExpenses(expenses);
                setBalance(income - expenses);
            }, [transactions]);

            const getCategoryData = () => {
                const categoryTotals = {};
                transactions.filter(t => t.type === 'debit').forEach(t => {
                    if (!categoryTotals[t.category]) categoryTotals[t.category] = 0;
                    categoryTotals[t.category] += Math.abs(t.amount);
                });
                return Object.entries(categoryTotals).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
            };

            const getMonthlyData = () => {
                const monthlyData = {};
                transactions.forEach(t => {
                    const month = t.date.substring(0, 7);
                    if (!monthlyData[month]) monthlyData[month] = { month, income: 0, expenses: 0 };
                    if (t.type === 'credit') {
                        monthlyData[month].income += t.amount;
                    } else {
                        monthlyData[month].expenses += Math.abs(t.amount);
                    }
                });
                return Object.values(monthlyData).sort((a, b) => a.month.localeCompare(b.month));
            };

            const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];

            return (
                <div className="container">
                    <div className="card">
                        <div className="header">
                            <div>
                                <div className="title">
                                    <Wallet size={36} />
                                    AI Personal Finance Tracker
                                </div>
                                <p className="subtitle">Smart UPI transaction analysis with ML categorization</p>
                            </div>
                            <div>
                                <input type="file" id="file-upload" accept=".pdf,.doc,.docx" onChange={handleFileUpload} disabled={isProcessing} />
                                <label htmlFor="file-upload" className="upload-btn" style={{ cursor: isProcessing ? 'not-allowed' : 'pointer' }}>
                                    <Upload />
                                    {isProcessing ? 'Processing...' : 'Upload Statement'}
                                </label>
                            </div>
                        </div>
                    </div>

                    <div className="card">
                        <div className="tabs">
                            {['dashboard', 'transactions', 'analytics'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`tab ${activeTab === tab ? 'active' : ''}`}>
                                    {tab}
                                </button>
                            ))}
                        </div>
                    </div>

                    {activeTab === 'dashboard' && (
                        <>
                            <div className="grid grid-3">
                                <div className="stat-card blue">
                                    <div className="stat-header">
                                        <Wallet size={32} />
                                        <span className="stat-label">Current Balance</span>
                                    </div>
                                    <div className="stat-value">₹{balance.toLocaleString()}</div>
                                </div>
                                <div className="stat-card green">
                                    <div className="stat-header">
                                        <TrendingUp />
                                        <span className="stat-label">Total Income</span>
                                    </div>
                                    <div className="stat-value">₹{totalIncome.toLocaleString()}</div>
                                </div>
                                <div className="stat-card red">
                                    <div className="stat-header">
                                        <TrendingDown />
                                        <span className="stat-label">Total Expenses</span>
                                    </div>
                                    <div className="stat-value">₹{totalExpenses.toLocaleString()}</div>
                                </div>
                            </div>

                            <div className="grid grid-2">
                                <div className="card">
                                    <div className="section-title">
                                        <Calendar />
                                        Monthly Trend
                                    </div>
                                    <ResponsiveContainer width="100%" height={300}>
                                        <LineChart data={getMonthlyData()}>
                                            <CartesianGrid strokeDasharray="3 3" />
                                            <XAxis dataKey="month" />
                                            <YAxis />
                                            <Tooltip />
                                            <Legend />
                                            <Line type="monotone" dataKey="income" stroke="#10b981" strokeWidth={2} />
                                            <Line type="monotone" dataKey="expenses" stroke="#ef4444" strokeWidth={2} />
                                        </LineChart>
                                    </ResponsiveContainer>
                                </div>

                                <div className="card">
                                    <div className="section-title">
                                        <PieChartIcon />
                                        Category Distribution
                                    </div>
                                    <ResponsiveContainer width="100%" height={300}>
                                        <PieChart>
                                            <Pie
                                                data={getCategoryData()}
                                                cx="50%"
                                                cy="50%"
                                                labelLine={false}
                                                label={({ name, percent }) => `${name} ${(percent * 100).toFixed(0)}%`}
                                                outerRadius={80}
                                                dataKey="value"
                                            >
                                                {getCategoryData().map((entry, index) => (
                                                    <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                                                ))}
                                            </Pie>
                                            <Tooltip />
                                        </PieChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            <div className="card">
                                <div className="section-title">
                                    <Tag />
                                    Top Spending Categories
                                </div>
                                <ResponsiveContainer width="100%" height={300}>
                                    <BarChart data={getCategoryData().slice(0, 6)}>
                                        <CartesianGrid strokeDasharray="3 3" />
                                        <XAxis dataKey="name" />
                                        <YAxis />
                                        <Tooltip />
                                        <Bar dataKey="value" fill="#3b82f6" radius={[8, 8, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </>
                    )}

                    {activeTab === 'transactions' && (
                        <div className="card">
                            <div className="section-title">
                                <FileText />
                                Recent Transactions ({transactions.length})
                            </div>
                            {transactions.length === 0 ? (
                                <div className="empty-state">
                                    <AlertCircle />
                                    <p style={{ fontSize: '18px', color: '#6b7280', marginTop: '12px' }}>No transactions yet</p>
                                    <p style={{ fontSize: '14px', color: '#9ca3af', marginTop: '8px' }}>Upload a UPI statement to get started</p>
                                </div>
                            ) : (
                                <div style={{ overflowX: 'auto' }}>
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Date</th>
                                                <th>Description</th>
                                                <th>Category</th>
                                                <th>Confidence</th>
                                                <th>Amount</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {transactions.map((txn) => (
                                                <tr key={txn.id}>
                                                    <td style={{ color: '#6b7280' }}>{txn.date}</td>
                                                    <td style={{ color: '#1f2937' }}>{txn.description}</td>
                                                    <td><span className="badge">{txn.category}</span></td>
                                                    <td style={{ color: '#6b7280' }}>{(txn.confidence * 100).toFixed(0)}%</td>
                                                    <td className={txn.type === 'credit' ? 'amount-credit' : 'amount-debit'}>
                                                        {txn.type === 'credit' ? '+' : '-'}₹{Math.abs(txn.amount).toLocaleString()}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'analytics' && (
                        <div>
                            <div className="card">
                                <h3 className="section-title">AI-Powered Insights</h3>
                                <div className="grid grid-2">
                                    <div className="insight-card blue">
                                        <h4 className="insight-title">💡 Top Spending Category</h4>
                                        <p className="insight-value">{getCategoryData()[0]?.name || 'N/A'} - ₹{getCategoryData()[0]?.value.toLocaleString() || 0}</p>
                                    </div>
                                    <div className="insight-card green">
                                        <h4 className="insight-title">📈 Savings Rate</h4>
                                        <p className="insight-value">{totalIncome > 0 ? ((1 - totalExpenses / totalIncome) * 100).toFixed(1) : 0}% of income saved</p>
                                    </div>
                                    <div className="insight-card yellow">
                                        <h4 className="insight-title">⚡ Average Daily Spending</h4>
                                        <p className="insight-value">₹{transactions.length > 0 ? (totalExpenses / 30).toFixed(0) : 0} per day</p>
                                    </div>
                                    <div className="insight-card purple">
                                        <h4 className="insight-title">🎯 ML Accuracy</h4>
                                        <p className="insight-value">
                                            {transactions.length > 0 ? (transactions.reduce((sum, t) => sum + parseFloat(t.confidence), 0) / transactions.length * 100).toFixed(1) : 0}% average confidence
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <div className="card">
                                <h3 className="section-title">Detailed Category Breakdown</h3>
                                {getCategoryData().map((category, index) => {
                                    const percentage = totalExpenses > 0 ? (category.value / totalExpenses * 100) : 0;
                                    return (
                                        <div key={category.name} className="progress-bar">
                                            <div className="progress-label">
                                                <span style={{ fontWeight: 600, color: '#374151' }}>{category.name}</span>
                                                <span style={{ color: '#6b7280' }}>₹{category.value.toLocaleString()} ({percentage.toFixed(1)}%)</span>
                                            </div>
                                            <div className="progress-track">
                                                <div className="progress-fill" style={{ width: `${percentage}%`, backgroundColor: COLORS[index % COLORS.length] }} />
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    <div className="footer">
                        <p>🤖 Powered by AI & Machine Learning | Mock ML categorization with {Object.keys(categoryRules).length} categories</p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FinanceTracker />);
    </script>
</body>
</html>
